# Publish site/ (explainer page, film) and the deck (at /deck/) to GitHub Pages on every push to main.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "slides/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site and deck
        run: |
          mkdir -p _site/deck
          cp -r site/. _site/
          cp slides/deck.html _site/deck/index.html
          cp -r slides/figures _site/deck/figures
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
